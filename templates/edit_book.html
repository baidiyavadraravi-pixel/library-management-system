<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Book - Library Management System</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="navbar">
    <h1>📚 Library Management System</h1>
    <div>
      <a href="{{ url_for('dashboard') }}">Back to Dashboard</a>
      <a href="{{ url_for('logout') }}">Logout</a>
    </div>
  </div>

  <div class="container">
    <h2 style="margin-bottom:15px;">Edit Book</h2>

    <form class="card-form" method="POST" action="{{ url_for('edit_book', book_id=book['id']) }}">
      <div class="form-group">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" value="{{ book['title'] }}" required>
      </div>
      <div class="form-group">
        <label for="author">Author</label>
        <input type="text" id="author" name="author" value="{{ book['author'] }}" required>
      </div>
      <div class="form-group">
        <label for="isbn">ISBN</label>
        <input type="text" id="isbn" name="isbn" value="{{ book['isbn'] }}">
      </div>
      <div class="form-group">
        <label for="category">Category</label>
        <input type="text" id="category" name="category" value="{{ book['category'] }}">
      </div>
      <div class="form-group">
        <label for="quantity">Quantity</label>
        <input type="number" id="quantity" name="quantity" min="0" value="{{ book['quantity'] }}" required>
      </div>
      <div class="form-group">
        <label for="available">Available Copies</label>
        <input type="number" id="available" name="available" min="0" value="{{ book['available'] }}" required>
      </div>
      <button type="submit" class="btn">Update Book</button>
    </form>
  </div>
</body>
</html>
